spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/EduFlow
spring.datasource.username=postgres
spring.datasource.password=sanjeevi2005
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Groq API Configuration
spring.profiles.active=dev
groq.api.key=${GROQ_API_KEY:gsk_placeholder}
groq.model=openai/gpt-oss-120b

# EduFlow Workload Allocation Strategy Configuration
eduflow.workload.allocation-mode=BALANCED_MODE
# Mobile Face Verification Settings
eduflow.attendance.face.enabled=true
eduflow.attendance.face.max-distance=0.55
